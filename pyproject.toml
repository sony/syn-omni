[tool.ruff]
line-length = 100
extend-exclude = ["build"]
src = [".", "vlm2vec_eval", "vlm2vec_eval/src/wave_model/wave_official", "tevatron/src"]

[tool.ruff.lint]
select = ["B", "C4", "C90", "E", "F", "W", "I"]
ignore = [
    "E203", "E221", "C901", "C408", "E741", "B017", "F811", "EXE001", "EXE002", "B905",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403", "E402"]
"**/configs/**/*.py" = ["F401", "E402", "I"]
"**/tests/config/**/*.py" = ["F401", "E402", "I"]
"datasets/**" = ["I"]
"docs/**" = ["I"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
extra-standard-library = ["setuptools", "mock"]
known-third-party = [
    "fvcore", "matplotlib", "cv2", "torch", "torchvision", "PIL", "pycocotools", "yacs",
    "termcolor", "tabulate", "tqdm", "scipy", "psutil", "pkg_resources", "caffe2", "onnx",
    "panopticapi", "black", "isort", "av", "iopath", "omegaconf", "hydra", "yaml", "pydoc",
    "submitit", "cloudpickle", "packaging", "timm", "pandas", "fairscale", "pytorch3d",
    "pytorch_lightning", "numpy", "transformers", "fire", "lightning", "open_clip", "loguru",
    "datasets", "img2dataset", "spacy", "gdown", "huggingface_hub", "pyinflect", "sng_parser",
    "nltk", "torchcodec", "torchaudio",
    "requests", "peft", "grad_cache", "liger_kernel", "flash_attn", "qwen_vl_utils",
    "qwen_omni_utils",
]
no-lines-before = ["standard-library"]
lines-between-types = 1
section-order = ["future", "standard-library", "third-party", "myself", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
myself = ["tevatron"]
